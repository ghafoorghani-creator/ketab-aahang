<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#D6A500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کتاب آهنگ غفور">
<title>کتاب آهنگ غفور</title>
<style>
:root{--gold:#D6A500;--gold2:#F3CC54;--pale:#FFF4C7;--bg:#FBF8EF;--ink:#292318;--muted:#786F60;--line:#E8DDC4;--card:#fff;--danger:#C43B31}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
.header{padding:calc(18px + env(safe-area-inset-top)) 17px 16px;background:linear-gradient(135deg,#211b0d,#5a430d 55%,#D6A500);color:#fff;border-radius:0 0 30px 30px}
.head{display:flex;align-items:center;gap:12px}.logo{width:59px;height:59px;border-radius:18px;border:2px solid #fff5bd;object-fit:cover}
h1{font-size:21px;margin:0;font-weight:900}.sub{font-size:12px;color:#ffeeb0;margin-top:4px}
.search{margin-top:14px;display:flex;gap:8px;align-items:center;background:#ffffff1b;border:1px solid #ffffff40;border-radius:16px;padding:11px 13px}
.search input{border:0;outline:0;background:transparent;color:#fff;width:100%}.search input::placeholder{color:#fff9}
.hero{margin:16px;border-radius:25px;overflow:hidden;height:215px;position:relative;background:#17130d;box-shadow:0 10px 28px #6d541c18}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.72}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#17130ddd,transparent 72%)}
.heroText{position:absolute;z-index:2;right:17px;bottom:15px;color:#fff}.heroText b{font-size:20px}.heroText div{font-size:12px;color:#ffe9a2;margin-top:4px}
.section{padding:0 16px;margin-top:18px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sectionHead h2{margin:0;font-size:18px}.link{background:none;color:#957000;font-size:12px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;color:#63553b}.chip.active{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:800}.addchip{background:var(--pale);border-style:dashed;color:#795e00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;min-height:118px;box-shadow:0 5px 15px #5b46110d}
.card h3{margin:0 0 7px;font-size:16px}.fav{position:absolute;left:8px;top:7px;border:0;background:none;color:#b29332;font-size:20px}.meta{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.tag{background:var(--pale);color:#715800;padding:4px 7px;border-radius:8px}.preview{font-size:12px;color:#6b6255;line-height:1.7;margin-top:9px;max-height:42px;overflow:hidden}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px 10px}
.fab{position:fixed;z-index:9;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:78px;width:58px;height:58px;border:0;border-radius:20px;background:var(--gold);color:#fff;font-size:29px;box-shadow:0 10px 25px #9d78004a}
.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#fffdf8e8;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:none;color:#817660;padding:6px 2px;border-radius:13px;font-size:11px}.nav button.active{background:#fff2bf;color:#8b6800;font-weight:800}.ico{display:block;font-size:20px;margin-bottom:2px}
.overlay{display:none;position:fixed;z-index:30;inset:0;background:#0008;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:19px 17px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0003}
.sheetTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheetTop h2{margin:0;font-size:20px}.close{border:0;width:38px;height:38px;border-radius:13px;background:#eee7d8;font-size:20px;color:#5e543f}
label{display:block;color:var(--muted);font-size:12px;margin:10px 2px 5px}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:0;color:var(--ink)}textarea{min-height:180px;line-height:1.9;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary,.secondary{width:100%;border:0;border-radius:15px;padding:13px;margin-top:14px;font-weight:800}.primary{background:var(--gold);color:#fff}.secondary{background:#eee7d8;color:#5e543f}.danger{color:var(--danger)}
.noteFull{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;line-height:2;font-size:15px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.itemBtns button{border:0;background:#f4edde;border-radius:10px;padding:8px;margin-right:3px}.small{font-size:12px;color:var(--muted)}
.toast{display:none;position:fixed;z-index:60;left:50%;bottom:145px;transform:translateX(-50%);background:#282318;color:#fff;padding:10px 15px;border-radius:13px;font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.hero{height:260px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
 <div class="head"><img id="logo" class="logo" alt="آیکن"><div><h1>کتاب آهنگ غفور</h1><div class="sub">دفترچه شخصی راگ، تال و نوت‌های آهنگ</div></div></div>
 <div class="search">⌕ <input id="search" placeholder="جستجوی آهنگ، راگ یا تال..." oninput="render()"></div>
</header>
<div class="hero"><img id="photo" alt="غفور"><div class="heroText"><b>کتاب آهنگ غفور</b><div>نوت‌هایت را مرتب و همیشه همراه داشته باش</div></div></div>

<section class="section"><div class="sectionHead"><h2>راگ‌ها</h2><button class="link" onclick="manage('raag')">مدیریت ✦</button></div><div id="raags" class="chips"></div></section>
<section class="section"><div class="sectionHead"><h2>تال‌ها</h2><button class="link" onclick="manage('taal')">مدیریت ✦</button></div><div id="taals" class="chips"></div></section>
<section class="section"><div class="sectionHead"><h2 id="listTitle">همه نوت‌ها</h2><span id="count" class="small"></span></div><div id="notes" class="grid"></div></section>
</div>

<button class="fab" onclick="openNote()">＋</button>
<div class="bottom"><div class="nav">
<button class="active" onclick="home()"><span class="ico">⌂</span>خانه</button>
<button onclick="openNote()"><span class="ico">✎</span>نوت جدید</button>
<button onclick="trash()"><span class="ico">♲</span>سطل زباله</button>
<button onclick="manage('all')"><span class="ico">⚙</span>مدیریت</button>
</div></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>

document.getElementById("logo").src=ICON; document.getElementById("photo").src=PHOTO;
const defaults={
raags:["بهیرو","بهیرو بهروی","درباری","شیورنجنی","بلاول","یمن","پهلوی","کافی","پهادی","بیهاگ","مالکونس"],
taals:["دادرا","گده","کهروا","مغولی","قطغنی","روپک","تین تال","جهپ تال","اک تال"],
notes:[
{id:1,title:"نمونه نوت آهنگ",song:"آهنگ نمونه",raag:"بهیرو",taal:"کهروا",text:"سا رِ گا ما | پا ما گا رِ | سا...",date:"2026-10-08",fav:false,deleted:false},
{id:2,title:"نوت تمرینی",song:"تمرین",raag:"درباری",taal:"دادرا",text:"نمونه برای شروع کتاب آهنگ غفور.",date:"2026-10-08",fav:false,deleted:false}
]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaults, filterRaag="همه",filterTaal="همه",editing=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function faDate(v){return new Intl.DateTimeFormat("fa-AF",{year:"numeric",month:"long",day:"numeric"}).format(new Date(v+"T12:00:00"))}
function enDate(v){return new Intl.DateTimeFormat("en-US",{year:"numeric",month:"short",day:"numeric"}).format(new Date(v+"T12:00:00"))}
function render(){
 let rs=["همه",...data.raags],ts=["همه",...data.taals];
 document.getElementById("raags").innerHTML=rs.map(x=>'<button class="chip '+(filterRaag===x?"active":"")+'" onclick="filterRaag='+JSON.stringify(x)+';render()">'+esc(x)+'</button>').join("")+'<button class="chip addchip" onclick="addCat(\'raag\')">＋ راگ</button>';
 document.getElementById("taals").innerHTML=ts.map(x=>'<button class="chip '+(filterTaal===x?"active":"")+'" onclick="filterTaal='+JSON.stringify(x)+';render()">'+esc(x)+'</button>').join("")+'<button class="chip addchip" onclick="addCat(\'taal\')">＋ تال</button>';
 let q=document.getElementById("search").value.trim().toLowerCase();
 let ns=data.notes.filter(n=>!n.deleted&&(filterRaag==="همه"||n.raag===filterRaag)&&(filterTaal==="همه"||n.taal===filterTaal));
 if(q)ns=ns.filter(n=>(n.title+n.song+n.raag+n.taal+n.text).toLowerCase().includes(q));
 document.getElementById("listTitle").textContent=(filterRaag==="همه"?"همه نوت‌ها":filterRaag)+(filterTaal==="همه"?"":" • "+filterTaal);
 document.getElementById("count").textContent=ns.length+" نوت";
 document.getElementById("notes").innerHTML=ns.length?ns.map(n=>'<article class="card" onclick="viewNote('+n.id+')"><button class="fav" onclick="event.stopPropagation();fav('+n.id+')">'+(n.fav?"★":"☆")+'</button><h3>'+esc(n.title)+'</h3><div class="meta"><span class="tag">'+esc(n.raag)+'</span><span class="tag">'+esc(n.taal)+'</span></div><div class="preview">'+esc(n.text)+'</div><div class="meta" style="margin-top:8px">'+faDate(n.date)+' · '+enDate(n.date)+'</div></article>').join(""):'<div class="empty">در این بخش هنوز نوتی نیست.<br>با دکمه ＋ اولین نوت را اضافه کن.</div>';
}
function openSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("overlay").classList.add("show")}
function closeSheet(){document.getElementById("overlay").classList.remove("show");editing=null}
function openNote(id=null){
 editing=id;let n=id?data.notes.find(x=>x.id===id):null,today=new Date().toISOString().slice(0,10);
 let ro=data.raags.map(x=>'<option '+((n?.raag||filterRaag)===x?"selected":"")+'>'+esc(x)+'</option>').join("");
 let ta=data.taals.map(x=>'<option '+((n?.taal||filterTaal)===x?"selected":"")+'>'+esc(x)+'</option>').join("");
 openSheet('<div class="sheetTop"><h2>'+(id?"ویرایش نوت":"نوت جدید")+'</h2><button class="close" onclick="closeSheet()">×</button></div>'+
 '<label>عنوان نوت</label><input id="title" value="'+esc(n?.title||"")+'" placeholder="مثلاً نوت آهنگ">'+
 '<label>نام آهنگ / خواننده</label><input id="song" value="'+esc(n?.song||"")+'" placeholder="نام آهنگ">'+
 '<div class="row"><div><label>راگ</label><select id="raag">'+ro+'</select></div><div><label>تال</label><select id="taal">'+ta+'</select></div></div>'+
 '<label>نوت آهنگ</label><textarea id="text" placeholder="سا رِ گا ما...">'+esc(n?.text||"")+'</textarea>'+
 '<label>تاریخ (قابل اصلاح)</label><input id="date" type="date" value="'+(n?.date||today)+'">'+
 '<button class="primary" onclick="saveNote()">ذخیره نوت</button>'+
 (id?'<button class="secondary danger" onclick="del('+id+')">انتقال به سطل زباله</button>':""));
}
function saveNote(){
 let n={id:editing||Date.now(),title:document.getElementById("title").value.trim()||"بدون عنوان",song:document.getElementById("song").value.trim(),raag:document.getElementById("raag").value,taal:document.getElementById("taal").value,text:document.getElementById("text").value,date:document.getElementById("date").value,fav:editing?(data.notes.find(x=>x.id===editing)?.fav||false):false,deleted:false};
 let i=data.notes.findIndex(x=>x.id===n.id);i>=0?data.notes[i]=n:data.notes.unshift(n);save();closeSheet();render();toast("نوت ذخیره شد ✓");
}
function viewNote(id){let n=data.notes.find(x=>x.id===id);openSheet('<div class="sheetTop"><h2>'+esc(n.title)+'</h2><button class="close" onclick="closeSheet()">×</button></div><div class="meta"><span class="tag">'+esc(n.raag)+'</span><span class="tag">'+esc(n.taal)+'</span></div><p class="small">تاریخ دری: '+faDate(n.date)+'<br>تاریخ میلادی: '+enDate(n.date)+'</p><div class="noteFull">'+esc(n.text)+'</div><button class="primary" onclick="openNote('+id+')">ویرایش</button><button class="secondary" onclick="fav('+id');closeSheet()">☆ علاقه‌مندی</button>')}
function fav(id){let n=data.notes.find(x=>x.id===id);if(n)n.fav=!n.fav;save();render()}
function del(id){let n=data.notes.find(x=>x.id===id);if(n)n.deleted=true;save();closeSheet();render();toast("به سطل زباله منتقل شد")}
function trash(){let ns=data.notes.filter(n=>n.deleted);openSheet('<div class="sheetTop"><h2>سطل زباله</h2><button class="close" onclick="closeSheet()">×</button></div><div class="small">نوت‌های حذف‌شده را می‌توانی برگردانی یا برای همیشه پاک کنی.</div>'+(ns.length?ns.map(n=>'<div class="item"><div><b>'+esc(n.title)+'</b><div class="small">'+esc(n.raag)+' • '+esc(n.taal)+'</div></div><div class="itemBtns"><button onclick="restore('+n.id+')">↩</button><button class="danger" onclick="hard('+n.id+')">×</button></div></div>').join(""):'<div class="empty">سطل زباله خالی است.</div>'))}
function restore(id){let n=data.notes.find(x=>x.id===id);if(n)n.deleted=false;save();trash();render();toast("نوت برگردانده شد")}
function hard(id){if(confirm("این نوت برای همیشه حذف شود؟")){data.notes=data.notes.filter(n=>n.id!==id);save();trash();render()}}
function addCat(type){let n=prompt(type==="raag"?"نام راگ جدید:":"نام تال جدید:");if(!n?.trim())return;let a=type==="raag"?data.raags:data.taals;if(!a.includes(n.trim()))a.push(n.trim());save();render();toast("اضافه شد ✓")}
function manage(type){
 let a=type==="taal"?data.taals:type==="raag"?data.raags:[...data.raags];
 let label=type==="taal"?"تال":"راگ";
 openSheet('<div class="sheetTop"><h2>مدیریت '+(type==="all"?"کتاب":label+"‌ها")+'</h2><button class="close" onclick="closeSheet()">×</button></div>'+
 (type==="all"?'<button class="primary" onclick="openNote()">＋ نوت جدید</button>':"")+
 '<button class="secondary" onclick="addCat(\''+(type==="taal"?"taal":"raag")+'\')">＋ افزودن '+label+'</button>'+
 a.map(x=>'<div class="item"><b>'+esc(x)+'</b><div class="itemBtns"><button onclick="renameCat(\''+(type==="taal"?"taal":"raag")+'\','+JSON.stringify(x)+')">✎</button><button class="danger" onclick="removeCat(\''+(type==="taal"?"taal":"raag")+'\','+JSON.stringify(x)+')">×</button></div></div>').join(""));
}
function renameCat(type,old){let n=prompt("نام جدید:",old);if(!n?.trim()||n.trim()===old)return;let a=type==="raag"?data.raags:data.taals,i=a.indexOf(old);if(i<0)return;a[i]=n.trim();data.notes.forEach(x=>{if(x[type]===old)x[type]=n.trim()});save();manage(type);render()}
function removeCat(type,name){if(data.notes.some(n=>!n.deleted&&n[type]===name)&&!confirm("این مورد در نوت‌ها استفاده شده. حذف شود؟"))return;let a=type==="raag"?data.raags:data.taals,i=a.indexOf(name);if(i>=0)a.splice(i,1);save();manage(type);render()}
function home(){filterRaag="همه";filterTaal="همه";render()}
function toast(s){let e=document.getElementById("toast");e.textContent=s;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
render();
</script>
